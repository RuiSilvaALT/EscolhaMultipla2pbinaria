<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ditados Rítmicos – Escolha Múltipla de 2 Pulsações</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17233c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:980px;margin:auto}h1{font-size:clamp(22px,3vw,32px);margin:0 0 8px}p{color:#53627a}.panel{background:white;border:1px solid #dfe6f0;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 4px 15px #15203a0a}.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:12px 18px;background:#2458cb;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#e6ecf8;color:#183f8e}button:disabled{opacity:.45;cursor:not-allowed}.modes button.active{background:#153b89;color:white}.modes button{background:#e6ecf8;color:#183f8e}.status{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.led{width:32px;height:32px;border-radius:50%;background:#d2dae9;border:3px solid #bdc9de;transition:background .08s,transform .08s}.led.on{background:#4caf80;box-shadow:0 0 0 6px #4caf8030;transform:scale(1.1)}.led.accent{background:#ffb23d;box-shadow:0 0 0 8px #ffb23d33;transform:scale(1.23)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.option{background:white;border:2px solid #d8e1f0;border-radius:14px;display:flex;align-items:center;gap:14px;padding:12px;min-height:118px;width:100%;color:#17233c;text-align:left}.option.selected{border-color:#2458cb;background:#edf3ff}.option.correct{border-color:#178452;background:#eaf9f1}.option.wrong{border-color:#cb3545;background:#fff0f1}.letter{font-size:21px;font-weight:800;min-width:24px}.notes{display:flex;align-items:center;justify-content:space-evenly;gap:8px;flex:1;min-width:0}.notes img{width:47%;max-width:170px;height:80px;object-fit:contain}.notes img.solo{width:90%;max-width:250px}.feedback{font-weight:650;min-height:25px;margin-top:14px}.hidden{display:none!important}#resultList{line-height:1.8}.small{font-size:13px;color:#62728b}@media(max-width:620px){body{padding:12px}.options{grid-template-columns:1fr}.option{min-height:98px}.notes img{height:68px}.panel{padding:14px}}
</style></head><body><main><h1>Ditados Rítmicos – Escolha Múltipla de 2 Pulsações</h1><p>Ouve o ditado e escolhe a representação rítmica correta.</p><section class="panel"><div class="toolbar modes"><button id="training" class="active">Modo Treino</button><button id="testing">Modo Teste</button></div><div class="status" style="margin-top:20px"><div><strong id="progress">Treino livre</strong><div class="small" id="listenCount">Audições: 0</div></div><div class="toolbar"><span class="small">Pulsação · 65 BPM</span><span id="led" class="led" aria-label="Indicador de pulsação"></span></div></div><div class="actions" style="margin-top:18px"><button id="play">▶ Ouvir ditado</button><button id="repeat" class="secondary">↻ Ouvir novamente</button><button id="confirm">Confirmar resposta</button><button id="next" class="secondary">Próximo exercício</button></div><p id="audioStatus" class="small" role="status">O metrónomo toca 4 pulsações antes do ditado e continua durante as 2 pulsações.</p></section><section id="question" class="panel"><strong>Escolhe uma opção:</strong><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div></section><section id="results" class="panel hidden"><h2>Resultado do teste</h2><h2 id="score"></h2><div id="resultList"></div><button id="restart">Novo teste</button></section></main><script>
'use strict';const BPM=65,BEAT=60/BPM,MAX_TEST=10;const labels=['A','B','C','D'];const $=id=>document.getElementById(id);let mode='train',index=0,attempts=0,selected=-1,confirmed=false,question=null,answers=[],playing=false,ctx=null,buffers={},activeSources=[],activeTimers=[],runToken=0;
const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a},key=a=>a.join(','),valid=a=>a.length===1?a[0]===1:a.length===2&&a.every(n=>n>=2&&n<=10)&&![3,8].includes(a[0]);
const sequences=(()=>{let out=[[1]];for(let a=2;a<=10;a++)for(let b=2;b<=10;b++)if(valid([a,b]))out.push([a,b]);return out})();
function newQuestion(){let pool=sequences.filter(s=>!question||key(s)!==key(question.correct));let correct=[...pool[rand(pool.length)]];let alternatives=sequences.filter(s=>key(s)!==key(correct));let dist=s=>{if(s.length!==correct.length)return 4;return s.reduce((v,n,i)=>v+(n===correct[i]?0:1),0)};let near=shuffle(alternatives.filter(s=>dist(s)===1));let others=near.slice(0,3);if(others.length<3){let more=shuffle(alternatives.filter(s=>!others.some(x=>key(x)===key(s)))).sort((a,b)=>dist(a)-dist(b));others.push(...more.slice(0,3-others.length))}let options=shuffle([correct,...others]);return {correct,options,correctIndex:options.findIndex(s=>key(s)===key(correct))}}
function update(){let test=mode==='test';$('progress').textContent=test?`Exercício ${Math.min(index+1,MAX_TEST)} de ${MAX_TEST}`:'Treino livre';$('listenCount').textContent=`Audições: ${attempts}${test?' / 3':''}`;$('play').disabled=playing||confirmed||(test&&attempts>=3);$('repeat').disabled=playing||confirmed||attempts===0||(test&&attempts>=3);$('confirm').disabled=playing||confirmed||selected<0;$('next').disabled=playing||!confirmed;$('next').textContent=test&&index===MAX_TEST-1?'Ver resultado':'Próximo exercício';$('training').classList.toggle('active',!test);$('testing').classList.toggle('active',test)}
function render(){selected=-1;confirmed=false;attempts=0;question=newQuestion();$('feedback').textContent='';$('audioStatus').textContent='O metrónomo toca 4 pulsações antes do ditado e continua durante as 2 pulsações.';$('results').classList.add('hidden');$('question').classList.remove('hidden');$('options').innerHTML='';question.options.forEach((seq,i)=>{let b=document.createElement('button');b.className='option';b.type='button';b.setAttribute('aria-label',`Opção ${labels[i]}`);let letter=document.createElement('span');letter.className='letter';letter.textContent=labels[i];let notes=document.createElement('span');notes.className='notes';seq.forEach(n=>{let img=document.createElement('img');img.src=`imagens/img${n}.png`;img.alt='';if(seq.length===1)img.className='solo';notes.append(img)});b.append(letter,notes);b.onclick=()=>{if(confirmed||playing)return;selected=i;document.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',i===j));update()};$('options').append(b)});update()}
async function loadAudio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let missing=Array.from({length:10},(_,i)=>i+1).filter(n=>!buffers[n]);await Promise.all(missing.map(async n=>{let r=await fetch(`sons/som${n}.mp3`);if(!r.ok)throw Error(`Não foi possível carregar som${n}.mp3`);buffers[n]=await ctx.decodeAudioData(await r.arrayBuffer())}))}
function schedule(fn,delay,token){let id=setTimeout(()=>{activeTimers=activeTimers.filter(x=>x!==id);if(token===runToken)fn()},delay);activeTimers.push(id)}
function stop(){runToken++;activeTimers.forEach(clearTimeout);activeTimers=[];activeSources.forEach(s=>{try{s.stop()}catch(e){}});activeSources=[];playing=false;$('led').className='led';update()}
function clickSound(t,accent){let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(accent?1050:750,t);osc.frequency.exponentialRampToValueAtTime(accent?600:450,t+.055);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(accent?.22:.12,t+.005);gain.gain.exponentialRampToValueAtTime(.0001,t+.075);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.08);activeSources.push(osc)}
function sample(n,t,beats){let source=ctx.createBufferSource();source.buffer=buffers[n];let gain=ctx.createGain();source.connect(gain).connect(ctx.destination);let length=beats*BEAT;source.playbackRate.value=source.buffer.duration/length;gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(1,t+.008);gain.gain.setValueAtTime(1,t+length-.018);gain.gain.linearRampToValueAtTime(.0001,t+length-.003);source.start(t);source.stop(t+length);activeSources.push(source)}
async function play(){if(playing||confirmed||(mode==='test'&&attempts>=3))return;playing=true;update();let token=++runToken;try{await loadAudio();if(token!==runToken)return;attempts++;$('audioStatus').textContent='A reproduzir…';let start=ctx.currentTime+.13;for(let i=0;i<6;i++){let t=start+i*BEAT;clickSound(t,i===0||i===4);schedule(()=>{$('led').className='led '+(i===0||i===4?'accent':'on');schedule(()=>{$('led').className='led'},190,token)},Math.max(0,(t-ctx.currentTime)*1000),token)}let t=start+4*BEAT;for(let n of question.correct){let beats=n===1?2:1;sample(n,t,beats);t+=beats*BEAT}let end=(start+6*BEAT-ctx.currentTime)*1000+100;schedule(()=>{playing=false;activeSources=[];$('led').className='led';$('audioStatus').textContent='Audição terminada.';update()},Math.max(0,end),token);update()}catch(e){playing=false;$('audioStatus').textContent=`Erro de áudio: ${e.message}. Publica a pasta no GitHub Pages para reproduzir os sons.`;update()}}
function confirm(){if(selected<0||confirmed||playing)return;confirmed=true;let right=selected===question.correctIndex;if(mode==='train'){$('feedback').textContent=right?'✓ Resposta correta!':`✗ Resposta incorreta. A opção correta é ${labels[question.correctIndex]}.`;document.querySelectorAll('.option').forEach((el,i)=>{if(i===question.correctIndex)el.classList.add('correct');else if(i===selected)el.classList.add('wrong')})}else{answers.push({choice:selected,correct:question.correctIndex,ok:right,seq:question.correct});$('feedback').textContent='Resposta registada. A correção será apresentada no final do teste.'}update()}
function finish(){stop();$('question').classList.add('hidden');$('results').classList.remove('hidden');let points=answers.filter(a=>a.ok).length;$('score').textContent=`Pontuação: ${points} / ${MAX_TEST}`;$('resultList').innerHTML='';answers.forEach((a,i)=>{let row=document.createElement('div');row.textContent=`${i+1}. ${a.ok?'✓':'✗'} Resposta: ${labels[a.choice]} · Correta: ${labels[a.correct]}`;$('resultList').append(row)});$('progress').textContent='Teste concluído';$('play').disabled=true;$('repeat').disabled=true;$('confirm').disabled=true;$('next').disabled=true}
function setMode(next){stop();mode=next;index=0;answers=[];render()}
$('training').onclick=()=>setMode('train');$('testing').onclick=()=>setMode('test');$('play').onclick=play;$('repeat').onclick=play;$('confirm').onclick=confirm;$('next').onclick=()=>{if(!confirmed)return;stop();if(mode==='test'){index++;if(index>=MAX_TEST){finish();return}}render()};$('restart').onclick=()=>setMode('test');render();
</script></body></html>
